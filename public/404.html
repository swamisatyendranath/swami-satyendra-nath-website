<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>स्वामी सत्येन्द्र नाथ जी | तंत्र, पूजा एवं वैदिक अनुष्ठान</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to the repository base URL
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #000000; color: #F59E0B; text-align: center; font-family: sans-serif; padding-top: 20vh;">
    <h2>॥ स्वामी सत्येन्द्र नाथ जी ॥</h2>
    <p>लोड हो रहा है, कृपया प्रतीक्षा करें...</p>
  </body>
</html>
