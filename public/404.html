<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>स्वामी सत्येन्द्र नाथ जी | तंत्र, पूजा एवं वैदिक अनुष्ठान</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/swami-satyendra-nath-website/" />
    <script>
      // Single Page Application redirect for GitHub Pages
      // Ensures visitors landing on any path or without trailing slash get redirected to site root
      var repoName = 'swami-satyendra-nath-website';
      var origin = window.location.origin;
      var pathname = window.location.pathname;

      if (!pathname.endsWith('/')) {
        if (pathname.endsWith(repoName)) {
          window.location.replace(origin + '/' + repoName + '/');
        } else {
          window.location.replace(origin + '/' + repoName + '/');
        }
      } else {
        window.location.replace(origin + '/' + repoName + '/');
      }
    </script>
  </head>
