name: Deploy Swami Satyendra Nath Website to GitHub Pages

on:
  # Trigger deployment on push to main or master branch
  push:
    branches:
      - main
      - master
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job: prepares code, installs packages, and compiles Vite production build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Build website for GitHub Pages (/swami-satyendra-nath-website/)
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /swami-satyendra-nath-website/

      - name: Verify dist contents
        run: |
          echo "Checking dist folder before artifact upload:"
          ls -la dist
          test -f dist/index.html || { echo "ERROR: dist/index.html not found!"; exit 1; }
          test -f dist/.nojekyll || { echo "Adding .nojekyll"; touch dist/.nojekyll; }

      - name: Upload dist artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deploy job: deploys the uploaded artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
